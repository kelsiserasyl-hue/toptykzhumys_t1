<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дененің инерттілігі</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#e6f5ff;--bg2:#c7e6fb;--ink:#12324d;--card:#ffffff;--line:#c4dcee;--blue:#1f6fb2;--ok:#1d9a55;--bad:#b4551f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#10263a;--bg2:#0c1b2b;--ink:#e6f2fc;--card:#173149;--line:#2b4b68}}
:root[data-theme="dark"]{--bg1:#10263a;--bg2:#0c1b2b;--ink:#e6f2fc;--card:#173149;--line:#2b4b68}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;color:var(--ink);font:400 15px/1.45 'Noto Sans',system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:10px 12px 18px}
h1{margin:4px 0 2px;font:800 clamp(20px,4.5vw,28px)/1.15 'Noto Sans',sans-serif;color:var(--blue);text-align:center}
.sub{text-align:center;margin:0 0 8px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.b{font:700 14px/1.15 'Noto Sans',system-ui,sans-serif;color:#fff;background:linear-gradient(#45a0ea,#1f6fb2);border:0;border-radius:12px;padding:10px 8px;box-shadow:0 5px 0 #14507f,0 9px 14px rgba(20,80,127,.3);cursor:pointer;transition:transform .12s,box-shadow .12s,filter .12s}
.b:hover{filter:brightness(1.08)}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 #14507f}
.b.on{background:linear-gradient(#f4c34f,#dca21c);color:#3a2900;box-shadow:0 5px 0 #96700f,0 9px 14px rgba(150,112,15,.35)}
.b.g{background:linear-gradient(#5fcf8c,#1d9a55);box-shadow:0 5px 0 #136b3a,0 9px 14px rgba(19,107,58,.3)}
button:focus-visible,input:focus-visible{outline:3px solid #7b4fc0;outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:0 8px 20px rgba(20,60,100,.14)}
canvas{width:100%;height:auto;max-height:46vh;display:block;border-radius:12px;background:linear-gradient(#f3fbff,#d9eefc);border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}
.row .sl{flex:1;min-width:200px}.sl input{width:100%;accent-color:var(--blue)}
.info{padding:8px 10px;border-left:5px solid #dca21c;background:rgba(220,162,28,.14);border-radius:8px;min-height:2.9em}
.q{border-top:1px dashed var(--line);padding:8px 0}
.q:first-child{border-top:0}
.q p{margin:0 0 4px;font-weight:600}
.q label{display:block;padding:3px 0;cursor:pointer}
.q .b{margin-top:6px;padding:8px 14px}
.fb{margin-top:6px;padding:6px 10px;border-radius:8px}.fb:empty{display:none}
.fb.g{background:rgba(29,154,85,.16);border-left:5px solid var(--ok)}
.fb.w{background:rgba(180,85,31,.14);border-left:5px solid var(--bad)}
@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main>
<h1>ДЕНЕНІҢ ИНЕРТТІЛІГІ</h1>
<p class="sub">Күш түсір, бақыла, салыстыр және қорытынды жаса</p>
<div class="tabs" id="mt" role="tablist">
<button class="b on" onclick="show(0)">1. Тәжірибе</button><button class="b" onclick="show(1)">2. Зерттеу</button>
<button class="b" onclick="show(2)">3. Бақыла</button><button class="b" onclick="show(3)">4. Тест</button></div>

<section class="card pn" id="p0">
<canvas id="c1" width="640" height="290"></canvas>
<div class="row"><label class="sl">Бірдей күш: <b id="fv">5</b> Н<input id="fs" type="range" min="1" max="10" value="5" oninput="setF(this.value)"></label>
<button class="b g" onclick="push()">Күш түсіру</button><button class="b" onclick="resetE()">Қайта бастау</button></div>
<div class="info" id="i1"></div>
</section>

<section class="card pn" id="p1" hidden><h3 style="margin:2px 0 6px">Зерттеу тапсырмасы</h3><div id="r"></div></section>

<section class="card pn" id="p2" hidden>
<div class="tabs" style="grid-template-columns:repeat(3,1fr)"><button class="b on" id="sb0" onclick="scn(0)">Автобус қозғалды</button><button class="b" id="sb1" onclick="scn(1)">Автобус тоқтады</button><button class="b" id="sb2" onclick="scn(2)">Үстелдегі кітап</button></div>
<canvas id="c3" width="640" height="250"></canvas>
<div class="row"><button class="b g" onclick="playS()">Көрсету</button></div>
<div class="info" id="i3"></div><div id="s"></div>
</section>

<section class="card pn" id="p3" hidden><h3 style="margin:2px 0 6px">Білімді тексер</h3><div id="t"></div></section>
</main>
<script>
const $=s=>document.querySelector(s);
/* ---- test / question engine ---- */
const Q={};
function qz(id,q,o,a){Q[id]={o:o.map(x=>x.split('|')),a};return `<div class="q"><p>${q}</p>${Q[id].o.map((x,j)=>`<label><input type="radio" name="r${id}" value="${j}"> ${x[0]}</label>`).join('')}<button class="b" onclick="ck('${id}')">ТЕКСЕРУ</button><div class="fb" id="f${id}" role="status"></div></div>`}
function ck(id){const r=document.querySelector(`input[name="r${id}"]:checked`),f=$('#f'+id);if(!r){f.className='fb w';f.textContent='Алдымен жауап нұсқасын таңда.';return}
 const j=+r.value,ok=j==Q[id].a;f.className='fb '+(ok?'g':'w');f.textContent=(ok?'✓ Дұрыс! ':'✗ Қате. ')+Q[id].o[j][1]+(ok?'':' Қайтадан ойланып көр.')}
$('#r').innerHTML=
qz('a1','Инерттілік дегеніміз не?',['Дененің жылдам қозғалу қабілеті|Жылдам қозғалу — инерттілік емес.','Дененің өз жылдамдығын (тыныштық не қозғалыс күйін) сақтауға тырысу қасиеті|Сыртқы әсер болмаса, дене қозғалыс күйін сақтайды.','Дененің ыстыққа төзімділігі|Бұл инерттілікке қатысты емес.'],1)+
qz('a2','Қай арбаның инерттілігі жоғары?',['Жеңіл арба (1 кг)|Жеңіл арба жылдамдығын тез өзгертті, сондықтан инерттілігі аз.','Ауыр арба (5 кг)|Ауыр арба бірдей күш әсер еткенде жылдамдығын баяу өзгертті.','Екеуінің де инерттілігі бірдей|Тәжірибеде арбалар әртүрлі жылдамдық алды.'],1)+
qz('a3','Дененің массасы артқан сайын инерттілігі қалай өзгереді?',['Артады|Масса үлкен болса, қозғалыс күйін өзгерту қиындайды.','Азаяды|Керісінше: массасы үлкен дене қозғалыс күйін қиынырақ өзгертеді.','Өзгермейді|Масса инерттілікті анықтайды, сондықтан ол өзгереді.'],0);
$('#t').innerHTML=
qz('t1','Футбол добы мен ауыр темір шарды бірдей күшпен тепсе, қайсысы жылдамырақ жылдамдық алады?',['Темір шар|Темір шардың массасы үлкен, жылдамдығы баяу өзгереді.','Футбол добы|Массасы аз дененің инерттілігі де аз.','Екеуі бірдей|Массалары әртүрлі болғандықтан, нәтиже де әртүрлі.'],1)+
qz('t2','Қозғалып келе жатқан автобус кенет тоқтағанда жолаушы алға еңкейеді. Бұл не?',['Инерция құбылысы|Дене бұрынғы қозғалыс күйін сақтауға тырысады.','Автобус жолаушыны алға итереді|Автобус итермейді, дененің өзі қозғалыс күйін сақтайды.','Жердің тартылуы|Алға еңкейуге Жердің тартылуы себеп емес.'],0)+
qz('t3','Дененің инерттілігін қандай физикалық шама сипаттайды?',['Түсі|Түс инерттілікке қатысы жоқ.','Масса|Масса неғұрлым үлкен болса, инерттілік те соғұрлым жоғары.','Температура|Температура инерттілікті анықтамайды.'],1);
/* ---- tabs ---- */
function show(i){document.querySelectorAll('.pn').forEach((p,k)=>p.hidden=k!=i);document.querySelectorAll('#mt .b').forEach((b,k)=>b.classList.toggle('on',k==i))}
/* ---- helpers ---- */
function arrow(c,x1,x2,y,w,col){const s=Math.sign(x2-x1)||1;c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x1,y);c.lineTo(x2-s*10,y);c.stroke();c.beginPath();c.moveTo(x2,y);c.lineTo(x2-s*14,y-8);c.lineTo(x2-s*14,y+8);c.fill()}
function arrowV(c,x,y1,y2,w,col){const s=Math.sign(y2-y1);c.strokeStyle=c.fillStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(x,y1);c.lineTo(x,y2-s*10);c.stroke();c.beginPath();c.moveTo(x,y2);c.lineTo(x-8,y2-s*14);c.lineTo(x+8,y2-s*14);c.fill()}
function txt(c,t,x,y,sz,col,al='center',wt=700){c.fillStyle=col;c.font=`${wt} ${sz}px 'Noto Sans',sans-serif`;c.textAlign=al;c.fillText(t,x,y)}
function box(c,x,y,w,h,d,fc,tc,sc){c.fillStyle=fc;c.fillRect(x,y,w,h);c.fillStyle=tc;c.beginPath();c.moveTo(x,y);c.lineTo(x+d,y-d);c.lineTo(x+w+d,y-d);c.lineTo(x+w,y);c.fill();c.fillStyle=sc;c.beginPath();c.moveTo(x+w,y);c.lineTo(x+w+d,y-d);c.lineTo(x+w+d,y+h-d);c.lineTo(x+w,y+h);c.fill()}
function cart(c,x,yg,m,col){const w=92,d=12,yp=yg-24;
 c.fillStyle='rgba(20,60,100,.2)';c.beginPath();c.ellipse(x+w/2+6,yg+2,w/2+12,6,0,0,6.3);c.fill();
 for(let i=0;i<m;i++)box(c,x+8+i*15,yp-15,14,14,5,'#7f8c99','#b4bfca','#5d6a77');
 box(c,x,yp,w,12,d,col[0],col[1],col[2]);
 [x+18,x+w-18].forEach(wx=>{c.fillStyle='#22323f';c.beginPath();c.arc(wx,yg-7,8,0,6.3);c.fill();c.fillStyle='#9fb2c2';c.beginPath();c.arc(wx,yg-7,3,0,6.3);c.fill()});
 txt(c,'m = '+m+' кг',x+w/2+6,yp-34,13,'#12324d')}
/* ---- experiment ---- */
const CC=[['#2bb3c9','#7ddbe9','#1b8296'],['#d9a21b','#f3cf6b','#9c7410']];
let E,F=5;const ctx1=$('#c1').getContext('2d'),X0=30,SC=20,PUSH=1.5;
function resetE(){E={t:0,run:false,done:false,x:[0,0],v:[0,0]};$('#i1').textContent='Екі арбаға да бірдей күш түседі. Күшті таңда да, «Күш түсіру» батырмасын бас.'}
function setF(v){F=+v;$('#fv').textContent=v;if(!E.run&&E.t>0)resetE()}
function push(){if(E.run)return;resetE();E.run=true;$('#i1').textContent='Күш екі арбаға да бірдей уақыт әсер етіп жатыр. Қайсысы жылдамырақ жылдамдық алғанын бақыла.'}
function stepE(dt){if(!E.run)return;E.t+=dt;[1,5].forEach((m,i)=>{if(E.t<=PUSH)E.v[i]+=F/m*dt;E.x[i]+=E.v[i]*dt});
 if(E.t>PUSH&&E.t-dt<=PUSH)$('#i1').textContent='Күш тоқтады. Арбалар жылдамдығын сақтап, инерция бойынша қозғала береді.';
 if(E.x[0]>=25||E.t>14){E.run=false;E.done=true;$('#i1').textContent=`Тәжірибе аяқталды. Күш бірдей болды (${F} Н), бірақ жеңіл арба ${E.v[0].toFixed(1)} м/с жылдамдық алды, ауыр арба — тек ${E.v[1].toFixed(1)} м/с. Ауыр арбаның қозғалыс күйі баяу өзгерді, демек оның инерттілігі жоғары.`}}
function drawE(){const c=ctx1;c.clearRect(0,0,640,290);
 [[120,0,1],[255,1,5]].forEach(([yg,i,m])=>{
  c.fillStyle='#a8c1d6';c.fillRect(0,yg,640,10);c.fillStyle='#8aa8c0';c.fillRect(0,yg+10,640,3);
  for(let k=0;k<=25;k+=5){c.fillStyle='#4a6a85';c.fillRect(X0+k*SC,yg,2,10);txt(c,k+' м',X0+k*SC+1,yg+25,10,'#4a6a85','center',400)}
  const x=X0+E.x[i]*SC;cart(c,x,yg,m,CC[i]);
  txt(c,'v = '+E.v[i].toFixed(1)+' м/с',x+52,yg-72,13,'#1f6fb2');
  if(E.run&&E.t<=PUSH){arrow(c,Math.max(2,x-6-F*7),x-4,yg-30,3+F*.5,'#d1341f');txt(c,'F = '+F+' Н',Math.max(30,x-6-F*7),yg-42,12,'#d1341f','left')}})}
resetE();
/* ---- scenarios ---- */
const ctx3=$('#c3').getContext('2d');let S=0,ST={t:3.5,run:false};
const SD=[
 ['Автобус орнынан қозғалып, жылдамдығын арттырып жатыр. Жолаушының аяғы автобуспен бірге жүреді. «Көрсету» батырмасын бас.',qz('s0','Жолаушы неге артқа шалқаяды?',['Аяқтары автобуспен бірге қозғалады, ал дененің жоғарғы бөлігі инерция бойынша тыныштық күйін сақтауға тырысады|Дұрыс түсіндірме.','Автобус жолаушыны артқа итереді|Автобус артқа итермейді, дененің өзі күйін сақтайды.','Жолаушыны артқа Жер тартады|Жердің тартылуы төмен бағытталған, артқа емес.'],0)],
 ['Автобус бірқалыпты жүріп келе жатыр, кенет тоқтайды. «Көрсету» батырмасын бас.',qz('s1','Жолаушы неге алға еңкейеді?',['Автобус тоқтады, ал дене инерция бойынша бұрынғы қозғалысын сақтай береді|Дұрыс түсіндірме.','Жолаушыны алдыңғы орындық тартады|Орындық тартпайды.','Жолаушы алға ұмтылғысы келеді|Мұның физикалық себебі — инерция.'],0)],
 ['Кітап үстелде жатыр. Оған әсер ететін күштер көрсетілген.',qz('s2','Кітап неге тыныштық күйін сақтайды?',['Оған әсер ететін күштер теңгерілген, сондықтан қозғалыс күйі өзгермейді|Дұрыс түсіндірме.','Кітап жеңіл болғандықтан|Масса үлкен немесе кіші болса да, күштер теңгерілсе дене күйін сақтайды.','Үстел кітапты өзіне жабыстырып ұстайды|Жабыстыру жоқ, ауырлық күші мен тірек әсері теңгерілген.'],0)]];
function scn(i){S=i;ST={t:i==2?3.5:0,run:false};[0,1,2].forEach(k=>$('#sb'+k).classList.toggle('on',k==i));$('#i3').textContent=SD[i][0];$('#s').innerHTML=SD[i][1]}
function playS(){if(S==2)return;ST={t:0,run:true}}
function stepS(dt){if(ST.run){ST.t+=dt;if(ST.t>=3.5){ST.t=3.5;ST.run=false}}}
function person(c,fx,fy,ang){const hx=fx,hy=fy-36,tx=hx+Math.sin(ang)*40,ty=hy-Math.cos(ang)*40;c.lineCap='round';c.strokeStyle='#3b3b6b';c.lineWidth=7;c.beginPath();c.moveTo(fx-9,fy);c.lineTo(hx,hy);c.lineTo(fx+9,fy);c.stroke();c.strokeStyle='#d9a21b';c.lineWidth=11;c.beginPath();c.moveTo(hx,hy);c.lineTo(tx,ty);c.stroke();c.fillStyle='#f1c9a0';c.beginPath();c.arc(tx+Math.sin(ang)*12,ty-Math.cos(ang)*12,10,0,6.3);c.fill()}
function drawS(){const c=ctx3,t=ST.t;c.clearRect(0,0,640,250);c.fillStyle='#a8c1d6';c.fillRect(0,206,640,44);
 if(S==2){box(c,200,150,240,12,16,'#b07a3a','#d4a35e','#7d5322');[230,400].forEach(x=>{c.fillStyle='#8c5f2a';c.fillRect(x,162,10,44)});
  box(c,285,128,70,22,8,'#2b6fdc','#6fa0f0','#1d4ea3');arrowV(c,320,100,120,3,'#d1341f');arrowV(c,320,180,160,3,'#1d9a55');
  txt(c,'Ауырлық күші',410,100,12,'#d1341f','center');txt(c,'Тірек әсері',405,185,12,'#1d9a55','center');txt(c,'Күштер теңгерілген: кітап тыныш тұр',320,30,15,'#12324d');return}
 const bx=S==0?40+30*t*t:40+140*Math.min(t,1.5),v=S==0?60*t:(t<1.5?140:0);
 box(c,bx,110,260,70,12,'#1f6fb2','#5ea4e0','#14507f');for(let i=0;i<4;i++){c.fillStyle='#d8f0ff';c.fillRect(bx+14+i*54,122,40,26)}
 [bx+50,bx+210].forEach(x=>{c.fillStyle='#22323f';c.beginPath();c.arc(x,184,15,0,6.3);c.fill();c.fillStyle='#9fb2c2';c.beginPath();c.arc(x,184,5,0,6.3);c.fill()});
 const ang=S==0?-.65*Math.min(1,t/.7):(t<1.5?0:.65*Math.min(1,(t-1.5)/.4));
 c.fillStyle='rgba(255,255,255,.55)';c.fillRect(bx+2,150,258,28);person(c,bx+120,176,ang);
 txt(c,S==0?(t>0?'Жылдамдық артады →':'Автобус тұр'):(t<1.5?(t>0?'Бірқалыпты қозғалыс →':'Автобус қозғалып келеді'):'Автобус тоқтады'),320,34,15,'#12324d');
 if(ST.t>0&&(S==0||t<1.5))arrow(c,bx+270,bx+270+Math.min(80,v*.6)+10,145,4,'#1d9a55')}
/* ---- loop ---- */
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;stepE(dt);drawE();stepS(dt);drawS();requestAnimationFrame(loop)}
scn(0);requestAnimationFrame(loop);
</script></body></html>
